[project]
name = "coin11-control-backend"
version = "0.3.0"
description = "Coin11-TB 网页控制平台后端 API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "websockets>=14.0",
    "gitpython>=3.1.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.0.0",
    "retry>=0.9.2",
    # coin11-tb 自动化脚本运行依赖（脚本由后端 venv 的 python 执行，utils.py 直接导入）
    "torch>=2.0",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "ddddocr>=1.4",
    "easyocr>=1.7",
    "uiautomator2>=3.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
